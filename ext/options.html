<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Venice Bridge — Options</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 12px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; font: 13px ui-monospace, monospace; padding: 6px; }
    textarea { height: 280px; }
    .row { margin-top: 12px; display: flex; gap: 8px; }
    .inline { display: flex; align-items: center; gap: 8px; }
    .inline input[type=checkbox] { width: auto; }
    .inline label { margin: 0; }
    .hint { font-weight: 400; color: #666; font-size: 12px; }
    #msg { margin-top: 8px; color: #070; }
  </style>
</head>
<body>
  <h1>Venice Bridge</h1>
  <p>Token didapat dari terminal: <code>node daemon.mjs token</code>.</p>
  <label for="port">Port daemon</label>
  <input id="port" type="number" value="8765">
  <label for="token">Token</label>
  <input id="token" type="password" autocomplete="off">
  <div class="inline" style="margin-top:12px">
    <input id="trustedInput" type="checkbox">
    <label for="trustedInput">Input tepercaya (event asli via debugger)</label>
  </div>
  <p class="hint">Lebih andal pada editor rich text. Memakai izin <code>debugger</code> dan memunculkan bar "Chrome is being controlled". Matikan saat mengkalibrasi selector; nyalakan setelahnya. DevTools tidak bisa dibuka di tab yang sama saat ini aktif.</p>
  <label for="typeDelayMs">Jeda antar ketik (ms)</label>
  <input id="typeDelayMs" type="number" value="35">
  <label for="typeJitter">Jitter ketik (0..0.9)</label>
  <input id="typeJitter" type="number" step="0.05" value="0.5">
  <label for="selectors">Selector (JSON). Kosongkan key untuk memakai default.</label>
  <textarea id="selectors" spellcheck="false"></textarea>
  <div class="row">
    <button id="save">Simpan</button>
    <button id="reset">Kembalikan selector default</button>
  </div>
  <div id="msg"></div>
  <script src="selectors.js"></script>
  <script src="options.js"></script>
</body>
</html>
